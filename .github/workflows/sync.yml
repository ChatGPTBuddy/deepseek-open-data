name: Sync data from deepseek.ai
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest files
        run: |
          set -e
          for f in deepseek-pricing.json deepseek-releases.json llm-api-pricing.json; do
            curl -fsSL "https://deepseek.ai/data/$f" -o "data/$f.new"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "data/$f.new"
            mv "data/$f.new" "data/$f"
          done
      - name: Commit if changed
        run: |
          git config user.name "deepseek.ai data bot"
          git config user.email "info@deepseek.ai"
          git add data
          git diff --cached --quiet || git commit -m "Update data from deepseek.ai ($(date -u +%Y-%m-%d))"
          git push
